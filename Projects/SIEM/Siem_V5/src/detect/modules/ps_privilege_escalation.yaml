title: Suspicious PowerShell Privilege Escalation and Account Manipulation
id: f790a117-f375-4ab8-bf28-22e081086784
description: >
    Detect PowerShell commands used to escalate privileges or manipulate accounts:
    adding users to admin groups (local and domain), creating accounts,
    UAC bypass techniques, token manipulation, and credential dumping.
status: experimental
author: Dams
date: 2026-02-22
logsource:
    product: windows
    service: powershell
    EventID: 4104

detection:
    # ── Local admin group addition ─────────────────────────────────────────
    # T1098 — Account Manipulation
    # Adding an account to the local Administrators group grants full
    # local admin rights. Used to secure persistence after initial access.
    selection_local_admin_add:
        ScriptBlockText|contains:
            - 'net localgroup administrators'
            - 'net localgroup "Administrators"'
            - 'Add-LocalGroupMember -Group "Administrators"'
            - 'Add-LocalGroupMember -Group Administrators'
            - 'net localgroup administrateurs'

    # ── Domain admin group addition ────────────────────────────────────────
    # T1098 — Account Manipulation (domain level)
    # Adding to Domain Admins or Enterprise Admins gives full domain control.
    # This is typically the final objective in a privilege escalation chain.
    selection_domain_admin_add:
        ScriptBlockText|contains:
            - 'Add-ADGroupMember'
            - 'Add-ADGroupMember.*Domain Admins'
            - 'net group "Domain Admins"'
            - 'net group "Enterprise Admins"'
            - 'net group /domain'

    # ── Local account creation ─────────────────────────────────────────────
    # T1136.001 — Create Account: Local Account
    # Creating a new account provides a persistent backdoor
    # that survives password resets on existing accounts.
    selection_create_account:
        ScriptBlockText|contains:
            - 'net user /add'
            - 'New-LocalUser'
            - 'New-ADUser'
            - 'net user.*password'
            - 'dsadd user'

    # ── UAC bypass techniques ──────────────────────────────────────────────
    # T1548.002 — Abuse Elevation Control Mechanism: Bypass UAC
    # These are known auto-elevating Windows binaries that can be
    # hijacked to run arbitrary code with elevated privileges
    # without triggering a UAC prompt.
    selection_uac_bypass:
        ScriptBlockText|contains:
            - 'fodhelper'
            - 'eventvwr'
            - 'computerdefaults'
            - 'sdclt'
            - 'cmstp'
            - 'bypassuac'
            - 'BypassUAC'
            - 'UACMe'

    # ── Access token manipulation ──────────────────────────────────────────
    # T1134 — Access Token Manipulation
    # Windows tokens encode user privileges. Duplicating or adjusting
    # a token lets an attacker impersonate another user or gain
    # SeDebugPrivilege, which grants full access to all processes.
    selection_token_manipulation:
        ScriptBlockText|contains:
            - 'ImpersonateLoggedOnUser'
            - 'DuplicateToken'
            - 'OpenProcessToken'
            - 'AdjustTokenPrivileges'
            - 'SeDebugPrivilege'
            - 'SeTcbPrivilege'

    # ── Credential dumping ─────────────────────────────────────────────────
    # T1003 — OS Credential Dumping
    # These patterns indicate active credential harvesting from LSASS.
    # Invoke-Mimikatz and sekurlsa are near-unambiguous indicators of attack.
    selection_credential_dump:
        ScriptBlockText|contains:
            - 'Invoke-Mimikatz'
            - 'sekurlsa'
            - 'lsadump'
            - 'Get-Credential'
            - 'ConvertTo-SecureString'
            - 'LSASS'
            - 'procdump.*lsass'
            - 'MiniDumpWriteDump'

    condition: 1 of selection_*

falsepositives:
    - 'System administrator scripts for account lifecycle management'
    - 'Automated onboarding pipelines creating batch user accounts'
    - 'Legitimate IAM tooling with privileged operations'
    - 'Get-Credential and ConvertTo-SecureString in authorized automation scripts'

level: high

fields:
    - ScriptBlockText
    - CommandLine

tags:
    - attack.privilege_escalation
    - attack.t1548.002
    - attack.t1134
    - attack.persistence
    - attack.t1098
    - attack.t1136.001
    - attack.credential_access
    - attack.t1003
